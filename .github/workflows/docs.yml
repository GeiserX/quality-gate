name: Docs

# The strict docs build as a pull request check. It never deploys: this repository
# has one Pages deployment, and build.yml owns it, because the same artifact carries
# the plugin catalogue (manifest.json) that every installed Jellyfin server polls.
# A push to main runs build.yml, which builds this same site and deploys it beside
# the manifest. Two deploying workflows would take turns overwriting each other.
#
# No paths filter, on purpose: a check skipped by a path filter stays Pending and
# blocks the merge once it is a required check. The build takes seconds.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (strict)
    # Public repo: GitHub-hosted runners are free and unlimited here, and the
    # job runs on pull requests, so it must never touch a self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes; a persisted token is readable by pip and by the build.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          # pip's download cache only. Zensical's own build cache (.cache/) is
          # never kept between runs: its docs advise against it on CI, and
          # --clean below starts from nothing anyway.
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install dependencies
        run: pip install -r docs/requirements-docs.txt

      # zensical.toml sets `strict = true`; the flag here keeps the build strict
      # even if someone removes that line. `python -m zensical`, never the bare
      # `zensical` command, the same as every other GeiserX docs site. The last
      # line is the guard build.yml relies on: the site must never produce a
      # manifest.json of its own.
      - name: Build
        run: |
          python -m zensical build --clean --strict
          test ! -e site/manifest.json

      # What the strict build does not check: a page in no nav entry, a nav
      # entry for a missing file, a missing image, a /rooted link, a raw <title>
      # in a page.
      - name: Check the built site
        run: python -I .github/scripts/site-check.py site
